<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Walkie Talkie</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #222;
            color: white;
            padding: 20px;
        }
        .btn {
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            margin: 20px 0;
            user-select: none;
            touch-action: manipulation;
        }
        .btn:active {
            background-color: #e64a19;
        }
        .btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        input, select {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            margin: 5px;
        }
        #status {
            margin-top: 20px;
            color: #bbb;
        }
        #login-screen, #main-screen {
            max-width: 500px;
            margin: 0 auto;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <!-- ============ LOGIN SCHERM ============ -->
    <div id="login-screen">
        <h1>🎙️ Web Walkie-Talkie</h1>
        <p>Log in met je naam en kies je kanaalnummer.</p>

        <div>
            <input type="text" id="name-input" placeholder="Jouw naam" maxlength="20">
        </div>
        <div>
            <select id="id-select">
                <option value="">-- Kies je kanaalnummer --</option>
                <option value="1100">1100</option>
                <option value="1101">1101</option>
                <option value="1102">1102</option>
                <option value="1103">1103</option>
                <option value="1104">1104</option>
                <option value="1105">1105</option>
                <option value="1106">1106</option>
                <option value="1107">1107</option>
                <option value="1108">1108</option>
                <option value="1109">1109</option>
                <option value="1110">1110</option>
            </select>
        </div>
        <button onclick="login()" style="padding: 12px 30px; border-radius: 5px; border: none; background: #4caf50; color: white; font-size: 16px; margin-top: 10px;">
            Inloggen
        </button>
        <div id="login-status" style="margin-top: 15px; color: #bbb;"></div>
    </div>

    <!-- ============ HOOFD SCHERM ============ -->
    <div id="main-screen" class="hidden">
        <h1>🎙️ Web Walkie-Talkie</h1>

        <div>
            <p>Ingelogd als: <strong id="my-name">-</strong></p>
            <p>Jouw kanaalnummer: <strong id="my-id">-</strong></p>
        </div>

        <hr style="border-color: #444;">

        <div>
            <h3>Verbinden met een vriend</h3>
            <select id="peer-id-input">
                <option value="">-- Kies kanaalnummer --</option>
                <option value="1100">1100</option>
                <option value="1101">1101</option>
                <option value="1102">1102</option>
                <option value="1103">1103</option>
                <option value="1104">1104</option>
                <option value="1105">1105</option>
                <option value="1106">1106</option>
                <option value="1107">1107</option>
                <option value="1108">1108</option>
                <option value="1109">1109</option>
                <option value="1110">1110</option>
            </select>
            <button onclick="connectToPeer()" style="padding: 10px 20px; border-radius: 5px; border: none; background: #4caf50; color: white; font-size: 16px;">
                Verbind
            </button>
        </div>

        <button id="talk-btn" class="btn" disabled>Houd ingedrukt om te praten</button>

        <div id="status">Status: Wachten...</div>
    </div>

    <script>
        let peer = null;
        let currentCall = null;
        let localStream = null;
        let conn = null;
        let myName = "";
        let myId = "";

        const talkBtn = document.getElementById('talk-btn');
        const statusDiv = document.getElementById('status');

        // ============ LOGIN ============
        function login() {
            const name = document.getElementById('name-input').value.trim();
            const id = document.getElementById('id-select').value;
            const loginStatus = document.getElementById('login-status');

            if (!name) {
                loginStatus.innerText = "Vul een naam in.";
                return;
            }
            if (!id) {
                loginStatus.innerText = "Kies een kanaalnummer.";
                return;
            }

            myName = name;
            myId = id;
            loginStatus.innerText = "Verbinden met server...";

            // Maak Peer met vaste ID
            peer = new Peer(id);

            peer.on('open', (assignedId) => {
                // Toon hoofdscherm
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-screen').classList.remove('hidden');
                document.getElementById('my-name').innerText = myName;
                document.getElementById('my-id').innerText = assignedId;
                statusDiv.innerText = "Status: Klaar voor verbinding. Kies een kanaalnummer om te bellen.";

                // Vraag meteen microfoon toegang
                askMicrophone();
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    loginStatus.innerText = "Dit kanaalnummer (" + id + ") is al in gebruik. Kies een ander nummer.";
                } else {
                    loginStatus.innerText = "Fout: " + err.type;
                }
                // Reset peer zodat opnieuw geprobeerd kan worden
                if (peer) {
                    peer.destroy();
                    peer = null;
                }
            });

            // Inkomende oproep
            peer.on('call', (call) => {
                currentCall = call;
                call.answer(localStream);

                call.on('stream', (remoteStream) => {
                    playRemoteStream(remoteStream);
                    statusDiv.innerText = "Status: Verbonden! Je kunt nu praten.";
                    talkBtn.disabled = false;
                });
            });

            // Inkomende data verbinding
            peer.on('connection', (c) => {
                conn = c;
                setupDataConnection();
            });
        }

        // ============ MICROFOON ============
        function askMicrophone() {
            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(stream => {
                    localStream = stream;
                    setMicrophoneMute(true); // standaard gedempt
                })
                .catch(err => {
                    statusDiv.innerText = "Status: Microfoon toegang geweigerd! " + err;
                });
        }

        // ============ VERBINDEN ============
        function connectToPeer() {
            const peerId = document.getElementById('peer-id-input').value;
            if (!peerId) return alert("Kies eerst een kanaalnummer!");

            if (peerId === myId) {
                return alert("Je kunt niet met jezelf verbinden. Kies een ander nummer.");
            }

            if (!localStream) {
                return alert("Microfoon is nog niet beschikbaar. Wacht even of geef toestemming.");
            }

            statusDiv.innerText = "Verbinden met " + peerId + "...";

            // Data verbinding
            conn = peer.connect(peerId);
            setupDataConnection();

            // Audio verbinding
            const call = peer.call(peerId, localStream);
            currentCall = call;

            call.on('stream', (remoteStream) => {
                playRemoteStream(remoteStream);
                statusDiv.innerText = "Status: Verbonden! Je kunt nu praten.";
                talkBtn.disabled = false;
            });

            call.on('error', (err) => {
                statusDiv.innerText = "Verbindingsfout: " + err;
            });
        }

        function setupDataConnection() {
            if (!conn) return;
            conn.on('open', () => {
                statusDiv.innerText = "Status: Verbonden! Je kunt nu praten.";
                talkBtn.disabled = false;
            });
        }

        // ============ AUDIO AFSPELEN ============
        function playRemoteStream(remoteStream) {
            let audio = document.getElementById('remote-audio');
            if (!audio) {
                audio = document.createElement('audio');
                audio.id = 'remote-audio';
                audio.autoplay = true;
                document.body.appendChild(audio);
            }
            audio.srcObject = remoteStream;
        }

        // ============ MICROFOON MUTEN ============
        function setMicrophoneMute(isMuted) {
            if (localStream) {
                localStream.getAudioTracks().forEach(track => {
                    track.enabled = !isMuted;
                });
            }
        }

        // ============ PUSH-TO-TALK ============
        function startTalking() {
            if (!talkBtn.disabled) {
                setMicrophoneMute(false);
                talkBtn.innerText = "🔊 JE SPREEKT NU...";
                talkBtn.style.backgroundColor = "#4caf50";
            }
        }

        function stopTalking() {
            setMicrophoneMute(true);
            talkBtn.innerText = "Houd ingedrukt om te praten";
            talkBtn.style.backgroundColor = "#ff5722";
        }

        talkBtn.addEventListener('mousedown', startTalking);
        talkBtn.addEventListener('mouseup', stopTalking);
        talkBtn.addEventListener('mouseleave', stopTalking);

        talkBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startTalking();
        });
        talkBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            stopTalking();
        });
    </script>
</body>
</html>
