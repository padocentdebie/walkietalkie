<!DOCTYPE html>
<html lang="nl" class="h-full bg-gray-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebRTC Tactical Walkie-Talkie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117;
            color: #f0f6fc;
            user-select: none;
            -webkit-user-select: none;
        }
        .font-mono-tech { font-family: 'Share Tech Mono', monospace; }
        .btn-ptt {
            background: radial-gradient(circle, #ff4500 0%, #cc0000 100%);
            box-shadow: 0 6px 0 #800000, 0 10px 20px rgba(255, 69, 0, 0.4);
            transition: all 0.1s ease;
        }
        .btn-ptt:active, .btn-ptt.active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #800000, 0 4px 10px rgba(255, 0, 0, 0.8);
            background: radial-gradient(circle, #ff0000 0%, #990000 100%);
        }
        .led-green { background-color: #00ff66; box-shadow: 0 0 10px #00ff66; }
        .led-red { background-color: #ff0033; box-shadow: 0 0 10px #ff0033; animation: pulse 1s infinite; }
        .led-amber { background-color: #ffb700; box-shadow: 0 0 10px #ffb700; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body class="h-full flex items-center justify-center p-2 sm:p-4">

    <!-- Audio Container (één per verbonden peer) -->
    <div id="audio-container"></div>

    <div class="w-full max-w-md bg-gray-900 border-2 border-gray-800 rounded-3xl shadow-2xl overflow-hidden flex flex-col h-[95vh] max-h-[850px] relative">
        
        <!-- Header -->
        <div class="bg-gray-950 px-6 py-3 border-b border-gray-800 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div id="status-led" class="w-3.5 h-3.5 rounded-full led-amber"></div>
                <span id="header-status" class="text-xs font-mono-tech text-gray-400 uppercase">Standby</span>
            </div>
            <span class="text-xs text-orange-500 font-mono-tech uppercase font-bold">TAC-RADIO v3.0</span>
        </div>

        <!-- Login Scherm -->
        <div id="login-screen" class="flex-1 p-6 flex flex-col justify-between">
            <div class="text-center my-auto">
                <div class="w-20 h-20 mx-auto bg-gray-800 border border-gray-700 rounded-full flex items-center justify-center mb-4">
                    <i class="fa-solid fa-walkie-talkie text-4xl text-orange-500"></i>
                </div>
                <h1 class="text-2xl font-black text-white uppercase tracking-wider mb-2">Tactical Comm</h1>
                
                <div class="space-y-4 text-left max-w-xs mx-auto mt-6">
                    <div>
                        <label class="block text-xs font-mono-tech text-orange-400 uppercase mb-1">Roepnaam</label>
                        <input type="text" id="name-input" placeholder="bijv. Eagle-1" class="w-full p-3 bg-gray-950 border border-gray-700 rounded-xl text-white font-mono-tech focus:outline-none focus:border-orange-500 uppercase">
                    </div>
                    <div>
                        <label class="block text-xs font-mono-tech text-orange-400 uppercase mb-1">Kanaal</label>
                        <select id="channel-select" class="w-full p-3 bg-gray-950 border border-gray-700 rounded-xl text-white font-mono-tech focus:outline-none focus:border-orange-500">
                            <option value="1100">Kanaal 1100 [Alpha]</option>
                            <option value="1101">Kanaal 1101 [Bravo]</option>
                            <option value="1102">Kanaal 1102 [Charlie]</option>
                            <option value="1103">Kanaal 1103 [Delta]</option>
                        </select>
                    </div>
                </div>

                <button onclick="login()" class="w-full max-w-xs mx-auto py-4 mt-6 bg-gradient-to-r from-orange-600 to-red-600 hover:from-orange-500 hover:to-red-500 text-white font-bold rounded-xl shadow-lg uppercase font-mono-tech">
                    <i class="fa-solid fa-power-off mr-2"></i> Verbinden
                </button>
                <div id="login-feedback" class="mt-3 text-xs font-mono-tech text-gray-400"></div>
            </div>
        </div>

        <!-- Hoofdscherm -->
        <div id="main-screen" class="hidden flex-1 flex flex-col justify-between p-4">
            
            <!-- LCD Display -->
            <div class="bg-emerald-950/40 border-2 border-emerald-800/60 rounded-2xl p-4 shadow-inner">
                <div class="flex justify-between items-center border-b border-emerald-800/40 pb-2 mb-2">
                    <div>
                        <span class="text-[10px] font-mono-tech text-emerald-600 uppercase block">Mijn Callsign</span>
                        <div id="disp-name" class="font-mono-tech text-base font-bold text-emerald-400">---</div>
                    </div>
                    <div class="text-right">
                        <span class="text-[10px] font-mono-tech text-emerald-600 uppercase block">Mijn Kanaal</span>
                        <div id="disp-channel" class="font-mono-tech text-lg font-bold text-emerald-300">CH-0000</div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2 mt-3 text-center">
                    <div class="bg-emerald-950/60 rounded-lg p-2 border border-emerald-800/40">
                        <span class="text-[10px] font-mono-tech text-emerald-600 uppercase block">Deelnemers</span>
                        <div id="disp-peers" class="font-mono-tech text-lg font-bold text-emerald-300">0</div>
                    </div>
                    <div class="bg-emerald-950/60 rounded-lg p-2 border border-emerald-800/40">
                        <span class="text-[10px] font-mono-tech text-emerald-600 uppercase block">Netwerk</span>
                        <div id="disp-network" class="font-mono-tech text-lg font-bold text-emerald-300">MESH</div>
                    </div>
                </div>
            </div>

            <!-- Radio Log -->
            <div id="radio-log" class="text-xs font-mono-tech text-emerald-400 my-4 text-center bg-gray-950 p-3 rounded-lg border border-gray-800 min-h-[60px] flex items-center justify-center">
                Kanaal geopend. Wachten op andere deelnemers...
            </div>

            <!-- Push-To-Talk Knop -->
            <div class="bg-gray-950 border border-gray-800 rounded-2xl p-6 flex flex-col items-center justify-center">
                <button id="ptt-btn" disabled class="btn-ptt w-36 h-36 rounded-full flex flex-col items-center justify-center text-white cursor-pointer select-none border-4 border-gray-900 opacity-50">
                    <i id="ptt-icon" class="fa-solid fa-microphone text-4xl mb-1"></i>
                    <span id="ptt-label" class="font-black text-xs uppercase tracking-widest">Houd in</span>
                </button>
            </div>
        </div>

    </div>

    <script>
        // ============================================================
        //  MESH WALKIE-TALKIE
        //  Iedereen op hetzelfde kanaal verbindt automatisch met elkaar.
        //  PTT → microfoon aan → iedereen hoort je.
        // ============================================================

        let peer = null;
        let localStream = null;
        let myName = '';
        let myChannel = '';
        let myPeerId = '';

        // Actieve verbindingen: { peerId: { call, audioEl } }
        const connections = {};

        const pttBtn = document.getElementById('ptt-btn');
        const pttIcon = document.getElementById('ptt-icon');
        const pttLabel = document.getElementById('ptt-label');
        const radioLog = document.getElementById('radio-log');
        const audioContainer = document.getElementById('audio-container');

        // ---------- LOGIN ----------
        async function login() {
            myName = document.getElementById('name-input').value.trim();
            myChannel = document.getElementById('channel-select').value;

            if (!myName) return alert("Vul a.u.b. een roepnaam in.");

            try {
                // Microfoon aanvragen
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true },
                    video: false
                });

                // Microfoon standaard UIT (push-to-talk)
                setMicMute(true);

                initPeer();
            } catch (err) {
                alert("Microfoontoegang is verplicht om de Walkie-Talkie te gebruiken.");
            }
        }

        // ---------- PEER INIT ----------
        function initPeer() {
            // Unieke ID per gebruiker, met kanaal-prefix
            // We voegen een willekeurig suffix toe om dubbele namen te voorkomen
            const uniqueSuffix = Math.random().toString(36).substring(2, 7);
            myPeerId = `walkie-ch${myChannel}-${uniqueSuffix}`;

            peer = new Peer(myPeerId, {
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', (id) => {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-screen').classList.remove('hidden');
                document.getElementById('disp-name').innerText = myName;
                document.getElementById('disp-channel').innerText = "CH-" + myChannel;
                setLed('green', 'Online');
                log("Kanaal " + myChannel + " geopend. Wachten op andere deelnemers...");

                // Zeg hallo tegen het netwerk (broadcast discovery)
                broadcastPresence();
            });

            peer.on('error', (err) => {
                console.error("Peer error:", err);
                if (err.type === 'unavailable-id') {
                    alert("Er ging iets mis met je ID. Probeer opnieuw.");
                    location.reload();
                } else if (err.type === 'peer-unavailable') {
                    // Iemand is niet bereikbaar – negeer
                } else {
                    log("Fout: " + err.type);
                }
            });

            // ---------- INKOMENDE CALL ----------
            peer.on('call', (call) => {
                console.log("Inkomende call van:", call.peer);
                call.answer(localStream); // antwoord altijd met onze stream (gedempt)
                handleCall(call);
            });
        }

        // ---------- CALL AFHANDELEN (inkomend + uitgaand) ----------
        function handleCall(call) {
            const peerId = call.peer;

            // Als we al een verbinding met deze peer hebben, sluit de oude
            if (connections[peerId]) {
                try { connections[peerId].call.close(); } catch(e) {}
                try { connections[peerId].audioEl.remove(); } catch(e) {}
                delete connections[peerId];
            }

            // Audio element aanmaken voor deze peer
            const audioEl = document.createElement('audio');
            audioEl.autoplay = true;
            audioEl.playsInline = true;
            audioEl.dataset.peerId = peerId;
            audioContainer.appendChild(audioEl);

            connections[peerId] = { call, audioEl };

            call.on('stream', (remoteStream) => {
                audioEl.srcObject = remoteStream;
                audioEl.play().catch(e => console.warn("Autoplay geblokkeerd:", e));
                updatePeerCount();
                enablePTT(true);
                log("Verbonden met " + peerId.split('-').pop() + ". Klaar om te praten.");
            });

            call.on('close', () => {
                console.log("Call gesloten:", peerId);
                removeConnection(peerId);
            });

            call.on('error', (err) => {
                console.error("Call error:", err);
                removeConnection(peerId);
            });
        }

        function removeConnection(peerId) {
            if (connections[peerId]) {
                try { connections[peerId].audioEl.remove(); } catch(e) {}
                delete connections[peerId];
            }
            updatePeerCount();
            if (Object.keys(connections).length === 0) {
                enablePTT(false);
                log("Geen deelnemers meer verbonden.");
            }
        }

        // ---------- PRESENCE / DISCOVERY ----------
        // We sturen een klein signaal via een data-verbinding om peers te laten weten dat we er zijn.
        // Omdat PeerJS geen broadcast kent, gebruiken we een simpele aanpak:
        // bij openen sturen we een "ping" naar alle kanalen binnen ons bereik.
        // In de praktijk: we proberen verbinding te maken met alle andere kanaalnummers.
        function broadcastPresence() {
            // We kennen de andere PeerJS-IDs niet direct.
            // Daarom sturen we een uitnodiging naar alle andere kanaalnummers.
            // Dit werkt alleen als er iemand op dat kanaal zit met een bekende ID.
            // Beter: we gebruiken een gedeelde "lobby" op een vast kanaal.
            // Voor nu: we wachten tot iemand anders ons belt.
            // Zie connectToPeer() hieronder voor handmatige verbinding.
        }

        // ---------- HANDMATIG VERBINDEN ----------
        // Omdat we de unieke ID van anderen niet weten (die heeft een random suffix),
        // bieden we een handmatige koppeling: kies een kanaal en verbind.
        // In de praktijk: beide partijen moeten op "Koppel" drukken.
        // Eenvoudiger: gebruik een gedeelde lobby-ID per kanaal.
        //
        // OPLOSSING: we maken één vast "kanaal-host" ID per kanaal.
        // Iedereen die binnenkomt, stuurt een bericht naar de host.
        // De host verbindt alle deelnemers met elkaar.
        //
        // Voor de eenvoud in deze versie: gebruik de kanaal-ID als vaste PeerJS-ID.
        // Iedereen die op kanaal 1100 zit, gebruikt ID "walkie-channel-1100".
        // Maar dan kan er maar 1 iemand per kanaal zijn...
        //
        // Daarom: MESH via vaste kanaalnaam + suffix werkt niet automatisch.
        // We gebruiken daarom een tussenoplossing: een "signaling" kanaal.

        // ---------- SIMPELE OPLOSSING: VASTE KANAAL-ID ----------
        // We laten iedereen op hetzelfde kanaal dezelfde PeerJS-ID gebruiken? Nee, dat kan niet.
        // Daarom: we gebruiken een DataConnection naar een vaste "host" per kanaal.
        // De host is de eerste die inlogt. Anderen verbinden met de host.
        // De host vertelt iedereen wie er zijn.
        //
        // Voor deze versie: we maken het simpel en robuust.
        // Iedereen die inlogt op kanaal X, probeert verbinding te maken met:
        //   walkie-host-X
        // Als dat lukt → host bestaat al → we worden deelnemer.
        // Als dat niet lukt → wij worden de host.

        // (Deze logica zit in de volgende versie. Voor nu: zie hieronder.)

        // ---------- PTT ----------
        function setMicMute(isMuted) {
            if (localStream) {
                localStream.getAudioTracks().forEach(track => {
                    track.enabled = !isMuted;
                });
            }
        }

        function startTransmitting() {
            if (pttBtn.disabled) return;
            setMicMute(false);
            pttBtn.classList.add('active');
            pttIcon.className = "fa-solid fa-podcast text-4xl mb-1 animate-pulse";
            pttLabel.innerText = "Zenden...";
            setLed('red', 'Zenden');
            log("🔊 Je spreekt nu... (" + Object.keys(connections).length + " luisteraars)");
        }

        function stopTransmitting() {
            if (pttBtn.disabled) return;
            setMicMute(true);
            pttBtn.classList.remove('active');
            pttIcon.className = "fa-solid fa-microphone text-4xl mb-1";
            pttLabel.innerText = "Houd in";
            setLed('green', 'Online');
            log("Transmissie beëindigd.");
        }

        function enablePTT(enable) {
            pttBtn.disabled = !enable;
            if (enable) {
                pttBtn.classList.remove('opacity-50');
            } else {
                pttBtn.classList.add('opacity-50');
            }
        }

        function updatePeerCount() {
            document.getElementById('disp-peers').innerText = Object.keys(connections).length;
        }

        function setLed(color, statusText) {
            document.getElementById('status-led').className = `w-3.5 h-3.5 rounded-full led-${color}`;
            document.getElementById('header-status').innerText = statusText;
        }

        function log(msg) {
            radioLog.innerText = msg;
        }

        // PTT events
        pttBtn.addEventListener('mousedown', startTransmitting);
        pttBtn.addEventListener('mouseup', stopTransmitting);
        pttBtn.addEventListener('mouseleave', stopTransmitting);
        pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTransmitting(); });
        pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopTransmitting(); });
    </script>
</body>
</html>
