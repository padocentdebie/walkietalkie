<!DOCTYPE html>
<html lang="nl" class="h-full bg-gray-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebRTC Tactical Walkie-Talkie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117;
            color: #f0f6fc;
            user-select: none;
            -webkit-user-select: none;
        }
        .font-mono-tech { font-family: 'Share Tech Mono', monospace; }
        .btn-ptt {
            background: radial-gradient(circle, #ff4500 0%, #cc0000 100%);
            box-shadow: 0 6px 0 #800000, 0 10px 20px rgba(255, 69, 0, 0.4);
            transition: all 0.1s ease;
        }
        .btn-ptt:active, .btn-ptt.active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #800000, 0 4px 10px rgba(255, 0, 0, 0.8);
            background: radial-gradient(circle, #ff0000 0%, #990000 100%);
        }
        .led-green { background-color: #00ff66; box-shadow: 0 0 10px #00ff66; }
        .led-red { background-color: #ff0033; box-shadow: 0 0 10px #ff0033; animation: pulse 1s infinite; }
        .led-amber { background-color: #ffb700; box-shadow: 0 0 10px #ffb700; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body class="h-full flex items-center justify-center p-2 sm:p-4">

    <!-- Audio container: 1 <audio> per verbonden peer -->
    <div id="audio-container"></div>

    <div class="w-full max-w-md bg-gray-900 border-2 border-gray-800 rounded-3xl shadow-2xl overflow-hidden flex flex-col h-[95vh] max-h-[850px] relative">
        
        <!-- Header -->
        <div class="bg-gray-950 px-6 py-3 border-b border-gray-800 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div id="status-led" class="w-3.5 h-3.5 rounded-full led-amber"></div>
                <span id="header-status" class="text-xs font-mono-tech text-gray-400 uppercase">Standby</span>
            </div>
            <span class="text-xs text-orange-500 font-mono-tech uppercase font-bold">TAC-RADIO v4.0</span>
        </div>

        <!-- Login Scherm -->
        <div id="login-screen" class="flex-1 p-6 flex flex-col justify-between">
            <div class="text-center my-auto">
                <div class="w-20 h-20 mx-auto bg-gray-800 border border-gray-700 rounded-full flex items-center justify-center mb-4">
                    <i class="fa-solid fa-walkie-talkie text-4xl text-orange-500"></i>
                </div>
                <h1 class="text-2xl font-black text-white uppercase tracking-wider mb-2">Tactical Comm</h1>
                
                <div class="space-y-4 text-left max-w-xs mx-auto mt-6">
                    <div>
                        <label class="block text-xs font-mono-tech text-orange-400 uppercase mb-1">Roepnaam</label>
                        <input type="text" id="name-input" placeholder="bijv. Eagle-1" class="w-full p-3 bg-gray-950 border border-gray-700 rounded-xl text-white font-mono-tech focus:outline-none focus:border-orange-500 uppercase">
                    </div>
                    <div>
                        <label class="block text-xs font-mono-tech text-orange-400 uppercase mb-1">Kanaal</label>
                        <select id="channel-select" class="w-full p-3 bg-gray-950 border border-gray-700 rounded-xl text-white font-mono-tech focus:outline-none focus:border-orange-500">
                            <!-- Wordt via JS gevuld: 1100 t/m 1115 -->
                        </select>
                    </div>
                </div>

                <button onclick="login()" class="w-full max-w-xs mx-auto py-4 mt-6 bg-gradient-to-r from-orange-600 to-red-600 hover:from-orange-500 hover:to-red-500 text-white font-bold rounded-xl shadow-lg uppercase font-mono-tech">
                    <i class="fa-solid fa-power-off mr-2"></i> Verbinden
                </button>
                <div id="login-feedback" class="mt-3 text-xs font-mono-tech text-gray-400"></div>
            </div>
        </div>

        <!-- Hoofdscherm -->
        <div id="main-screen" class="hidden flex-1 flex flex-col justify-between p-4">
            
            <!-- LCD Display -->
            <div class="bg-emerald-950/40 border-2 border-emerald-800/60 rounded-2xl p-4 shadow-inner">
                <div class="flex justify-between items-center border-b border-emerald-800/40 pb-2 mb-2">
                    <div>
                        <span class="text-[10px] font-mono-tech text-emerald-600 uppercase block">Mijn Callsign</span>
                        <div id="disp-name" class="font-mono-tech text-base font-bold text-emerald-400">---</div>
                    </div>
                    <div class="text-right">
                        <span class="text-[10px] font-mono-tech text-emerald-600 uppercase block">Mijn Kanaal</span>
                        <div id="disp-channel" class="font-mono-tech text-lg font-bold text-emerald-300">CH-0000</div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2 mt-3 text-center">
                    <div class="bg-emerald-950/60 rounded-lg p-2 border border-emerald-800/40">
                        <span class="text-[10px] font-mono-tech text-emerald-600 uppercase block">Deelnemers</span>
                        <div id="disp-peers" class="font-mono-tech text-lg font-bold text-emerald-300">0</div>
                    </div>
                    <div class="bg-emerald-950/60 rounded-lg p-2 border border-emerald-800/40">
                        <span class="text-[10px] font-mono-tech text-emerald-600 uppercase block">Rol</span>
                        <div id="disp-role" class="font-mono-tech text-lg font-bold text-emerald-300">--</div>
                    </div>
                </div>

                <div id="disp-peer-list" class="mt-2 text-[10px] font-mono-tech text-emerald-500 text-center leading-tight"></div>
            </div>

            <!-- Radio Log -->
            <div id="radio-log" class="text-xs font-mono-tech text-emerald-400 my-3 text-center bg-gray-950 p-3 rounded-lg border border-gray-800 min-h-[50px] flex items-center justify-center">
                Kanaal wordt geopend...
            </div>

            <!-- Push-To-Talk Knop -->
            <div class="bg-gray-950 border border-gray-800 rounded-2xl p-4 flex flex-col items-center justify-center">
                <button id="ptt-btn" disabled class="btn-ptt w-36 h-36 rounded-full flex flex-col items-center justify-center text-white cursor-pointer select-none border-4 border-gray-900 opacity-50">
                    <i id="ptt-icon" class="fa-solid fa-microphone text-4xl mb-1"></i>
                    <span id="ptt-label" class="font-black text-xs uppercase tracking-widest">Houd in</span>
                </button>
            </div>
        </div>

    </div>

    <script>
        // ============================================================
        //  MESH WALKIE-TALKIE met vaste host per kanaal
        // ============================================================

        // Kanaalnummers 1100 t/m 1115
        const CHANNELS = [];
        for (let i = 1100; i <= 1115; i++) CHANNELS.push(i);

        const HOST_PREFIX = "tacradio-host-";   // vaste host per kanaal
        const PEER_PREFIX = "tacradio-peer-";   // unieke peer-ID per gebruiker

        let peer = null;
        let localStream = null;
        let myName = '';
        let myChannel = '';
        let myPeerId = '';
        let isHost = false;
        let hostConn = null;       // dataconnectie naar de host (als we geen host zijn)
        let hostCall = null;       // audiocall naar de host (als we geen host zijn)

        // Actieve verbindingen: { peerId: { call, audioEl, name } }
        const connections = {};

        // Host-administratie
        let hostDataConns = {};    // { peerId: dataConn }
        let hostCallConns = {};    // { peerId: mediaCall }
        let hostPeers = {};        // { peerId: { name, call, audioEl } }

        const pttBtn = document.getElementById('ptt-btn');
        const pttIcon = document.getElementById('ptt-icon');
        const pttLabel = document.getElementById('ptt-label');
        const radioLog = document.getElementById('radio-log');
        const audioContainer = document.getElementById('audio-container');

        // ---------- Kanaal-dropdown vullen ----------
        (function fillChannels() {
            const sel = document.getElementById('channel-select');
            CHANNELS.forEach(ch => {
                const opt = document.createElement('option');
                opt.value = ch;
                opt.textContent = "Kanaal " + ch;
                sel.appendChild(opt);
            });
        })();

        // ---------- LOGIN ----------
        async function login() {
            myName = document.getElementById('name-input').value.trim();
            myChannel = document.getElementById('channel-select').value;

            if (!myName) return alert("Vul a.u.b. een roepnaam in.");
            if (!myChannel) return alert("Kies een kanaal.");

            document.getElementById('login-feedback').innerText = "Microfoon aanvragen...";

            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true },
                    video: false
                });
                setMicMute(true); // PTT: standaard gedempt
                document.getElementById('login-feedback').innerText = "Verbinden...";
                initPeer();
            } catch (err) {
                alert("Microfoontoegang is verplicht. Fout: " + err.message);
            }
        }

        // ---------- PEER INIT ----------
        function initPeer() {
            const suffix = Math.random().toString(36).substring(2, 8);
            myPeerId = PEER_PREFIX + myChannel + "-" + suffix;

            peer = new Peer(myPeerId, {
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', () => {
                // Scherm wisselen
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-screen').classList.remove('hidden');
                document.getElementById('disp-name').innerText = myName;
                document.getElementById('disp-channel').innerText = "CH-" + myChannel;
                log("Kanaal " + myChannel + " geopend. Verbinden met netwerk...");
                setLed('amber', 'Verbinden');

                // Probeer host te worden OF verbind met bestaande host
                tryBecomeHost();
            });

            peer.on('error', (err) => {
                console.error("Peer error:", err);
                if (err.type === 'unavailable-id') {
                    log("ID bezet. Opnieuw proberen...");
                    setTimeout(initPeer, 500);
                } else if (err.type === 'peer-unavailable') {
                    // host niet bereikbaar → misschien net weg
                    log("Host niet bereikbaar. Opnieuw proberen...");
                    setTimeout(tryBecomeHost, 1000);
                }
            });

            // Inkomende dataconnectie (host krijgt deze van nieuwe peers)
            peer.on('connection', (conn) => {
                if (isHost) {
                    handleIncomingDataConn(conn);
                } else {
                    // Als we geen host zijn, negeer (zou niet moeten gebeuren)
                    conn.close();
                }
            });

            // Inkomende audiocall (host krijgt deze van nieuwe peers)
            peer.on('call', (call) => {
                if (isHost) {
                    handleIncomingCallAsHost(call);
                } else {
                    // Als we geen host zijn, kan dit een mesh-call zijn van een andere peer
                    handleIncomingCallAsPeer(call);
                }
            });
        }

        // ---------- HOST WORDEN of VERBINDEN ----------
        function tryBecomeHost() {
            // We proberen eerst host te worden.
            // Als de host-ID al bezet is, wordt de host-connectie geweigerd
            // → dan verbinden we met de bestaande host.

            const hostId = HOST_PREFIX + myChannel;

            // Maak een tijdelijke peer met host-ID om te proberen host te worden
            // Als het lukt → wij zijn host
            // Als het mislukt → verbind met bestaande host

            const hostPeer = new Peer(hostId, {
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            hostPeer.on('open', () => {
                // We zijn host!
                isHost = true;
                console.log("Ik ben host voor kanaal", myChannel);
                document.getElementById('disp-role').innerText = "HOST";
                setLed('green', 'Host online');
                log("Jij bent host van kanaal " + myChannel + ". Wachten op deelnemers...");
                enablePTT(true);

                // Gebruik hostPeer als main peer voor inkomende verbindingen
                // We sluiten de originele peer en gebruiken hostPeer
                if (peer) {
                    try { peer.destroy(); } catch(e) {}
                }
                peer = hostPeer;
                setupHostListeners();
            });

            hostPeer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    // Host bestaat al → verbind met bestaande host
                    console.log("Host bestaat al. Verbinden als deelnemer.");
                    try { hostPeer.destroy(); } catch(e) {}
                    connectToHost();
                } else {
                    console.error("Host peer error:", err);
                    connectToHost();
                }
            });
        }

        // ---------- ALS DEELNEMER MET HOST VERBINDEN ----------
        function connectToHost() {
            isHost = false;
            document.getElementById('disp-role').innerText = "PEER";

            const hostId = HOST_PREFIX + myChannel;

            // Data verbinding naar host
            hostConn = peer.connect(hostId, { reliable: true });

            hostConn.on('open', () => {
                // Stuur onze naam
                hostConn.send({ type: 'hello', name: myName, peerId: myPeerId });
                setLed('green', 'Online');
                log("Verbonden met host. Wachten op andere deelnemers...");
            });

            hostConn.on('data', (data) => {
                handleHostMessage(data);
            });

            hostConn.on('close', () => {
                log("Host is weg. Opnieuw verbinden...");
                setLed('amber', 'Herverbinden');
                enablePTT(false);
                // Sluit alle huidige verbindingen
                Object.keys(connections).forEach(pid => removeConnection(pid));
                // Probeer host te worden
                setTimeout(() => {
                    // Nieuwe peer initialiseren
                    if (peer) { try { peer.destroy(); } catch(e) {} }
                    initPeer();
                }, 1500);
            });

            hostConn.on('error', (err) => {
                console.error("Host conn error:", err);
            });

            // Audio verbinding naar host (host stuurt onze audio door naar anderen)
            hostCall = peer.call(hostId, localStream);
            if (hostCall) {
                hostCall.on('stream', (remoteStream) => {
                    // We horen de host (die op zijn beurt anderen doorstuurt)
                    let audioEl = document.getElementById('host-audio');
                    if (!audioEl) {
                        audioEl = document.createElement('audio');
                        audioEl.id = 'host-audio';
                        audioEl.autoplay = true;
                        audioEl.playsInline = true;
                        audioContainer.appendChild(audioEl);
                    }
                    audioEl.srcObject = remoteStream;
                    audioEl.play().catch(e => console.warn("Autoplay:", e));
                });
                hostCall.on('close', () => {
                    console.log("Host call gesloten");
                });
            }
        }

        // ---------- HOST: listeners ----------
        function setupHostListeners() {
            // Luister op de host-peer naar nieuwe dataconnecties
            peer.on('connection', (conn) => {
                handleIncomingDataConn(conn);
            });

            // Luister op de host-peer naar nieuwe audiocalls
            peer.on('call', (call) => {
                handleIncomingCallAsHost(call);
            });
        }

        // ---------- HOST: inkomende dataconnectie ----------
        function handleIncomingDataConn(conn) {
            const remoteId = conn.peer;
            console.log("Host: inkomende dataconnectie van", remoteId);

            conn.on('data', (data) => {
                if (data.type === 'hello') {
                    // Nieuwe deelnemer
                    hostDataConns[remoteId] = conn;
                    hostPeers[remoteId] = { name: data.name, call: null, audioEl: null };

                    // Stuur huidige deelnemerslijst naar nieuwkomer
                    const peerList = Object.keys(hostPeers).map(pid => ({
                        peerId: pid,
                        name: hostPeers[pid].name
                    }));
                    conn.send({ type: 'peer-list', peers: peerList });

                    // Stuur de nieuwkomer naar alle andere deelnemers
                    broadcastToHostPeers({
                        type: 'new-peer',
                        peerId: remoteId,
                        name: data.name
                    }, remoteId);

                    log("Deelnemer " + data.name + " toegetreden.");
                    updateHostDisplay();
                }
            });

            conn.on('close', () => {
                console.log("Host: deelnemer weg", remoteId);
                const name = hostPeers[remoteId] ? hostPeers[remoteId].name : "?";
                if (hostPeers[remoteId] && hostPeers[remoteId].audioEl) {
                    hostPeers[remoteId].audioEl.remove();
                }
                delete hostDataConns[remoteId];
                delete hostPeers[remoteId];

                // Laat alle anderen weten dat deze weg is
                broadcastToHostPeers({
                    type: 'peer-left',
                    peerId: remoteId
                }, null);

                log("Deelnemer " + name + " vertrokken.");
                updateHostDisplay();
            });
        }

        // ---------- HOST: inkomende audiocall ----------
        function handleIncomingCallAsHost(call) {
            const remoteId = call.peer;
            console.log("Host: inkomende call van", remoteId);

            call.answer(localStream);

            // Audio element voor deze peer aanmaken
            const audioEl = document.createElement('audio');
            audioEl.autoplay = true;
            audioEl.playsInline = true;
            audioEl.dataset.peerId = remoteId;
            audioContainer.appendChild(audioEl);

            if (!hostPeers[remoteId]) hostPeers[remoteId] = { name: "?", call: null, audioEl: null };
            hostPeers[remoteId].call = call;
            hostPeers[remoteId].audioEl = audioEl;

            call.on('stream', (remoteStream) => {
                audioEl.srcObject = remoteStream;
                audioEl.play().catch(e => console.warn("Autoplay:", e));
            });

            call.on('close', () => {
                audioEl.remove();
                if (hostPeers[remoteId]) hostPeers[remoteId].call = null;
            });
        }

        // ---------- DEELNEMER: inkomende call (mesh) ----------
        function handleIncomingCallAsPeer(call) {
            console.log("Peer: inkomende mesh-call van", call.peer);
            call.answer(localStream);

            const audioEl = document.createElement('audio');
            audioEl.autoplay = true;
            audioEl.playsInline = true;
            audioEl.dataset.peerId = call.peer;
            audioContainer.appendChild(audioEl);

            connections[call.peer] = {
                call: call,
                audioEl: audioEl,
                name: connections[call.peer] ? connections[call.peer].name : "Peer"
            };

            call.on('stream', (remoteStream) => {
                audioEl.srcObject = remoteStream;
                audioEl.play().catch(e => console.warn("Autoplay:", e));
                updatePeerCount();
                enablePTT(true);
            });

            call.on('close', () => {
                removeConnection(call.peer);
            });
        }

        // ---------- HOST: broadcast naar alle peers ----------
        function broadcastToHostPeers(msg, excludePeerId) {
            Object.keys(hostDataConns).forEach(pid => {
                if (pid === excludePeerId) return;
                try { hostDataConns[pid].send(msg); } catch(e) {}
            });
        }

        // ---------- DEELNEMER: bericht van host ----------
        function handleHostMessage(data) {
            if (data.type === 'peer-list') {
                // Lijst met bestaande peers → verbind met elk
                data.peers.forEach(p => {
                    if (p.peerId === myPeerId) return;
                    connectToMeshPeer(p.peerId, p.name);
                });
            } else if (data.type === 'new-peer') {
                // Nieuwe peer → verbind met hem
                if (data.peerId !== myPeerId) {
                    connectToMeshPeer(data.peerId, data.name);
                }
            } else if (data.type === 'peer-left') {
                // Peer weg → sluit verbinding
                removeConnection(data.peerId);
            }
        }

        // ---------- MESH: verbinden met andere peer ----------
        function connectToMeshPeer(peerId, name) {
            if (connections[peerId]) return; // al verbonden
            if (peerId === myPeerId) return;

            console.log("Mesh: verbinden met", peerId);

            const call = peer.call(peerId, localStream);
            if (!call) return;

            const audioEl = document.createElement('audio');
            audioEl.autoplay = true;
            audioEl.playsInline = true;
            audioEl.dataset.peerId = peerId;
            audioContainer.appendChild(audioEl);

            connections[peerId] = { call, audioEl, name: name || "Peer" };

            call.on('stream', (remoteStream) => {
                audioEl.srcObject = remoteStream;
                audioEl.play().catch(e => console.warn("Autoplay:", e));
                updatePeerCount();
                enablePTT(true);
                log("Verbonden met " + (name || "peer") + ". Klaar om te praten.");
            });

            call.on('close', () => {
                removeConnection(peerId);
            });

            call.on('error', (err) => {
                console.error("Mesh call error:", err);
                removeConnection(peerId);
            });
        }

        function removeConnection(peerId) {
            if (connections[peerId]) {
                try { connections[peerId].audioEl.remove(); } catch(e) {}
                delete connections[peerId];
            }
            updatePeerCount();
            if (Object.keys(connections).length === 0 && !isHost) {
                enablePTT(false);
                log("Geen deelnemers meer verbonden.");
            }
        }

        // ---------- HOST: display updaten ----------
        function updateHostDisplay() {
            updatePeerCount();
            const names = Object.values(hostPeers).map(p => p.name).filter(n => n !== "?");
            document.getElementById('disp-peer-list').innerText = names.length ? names.join(", ") : "";
        }

        // ---------- PTT ----------
        function setMicMute(isMuted) {
            if (localStream) {
                localStream.getAudioTracks().forEach(track => {
                    track.enabled = !isMuted;
                });
            }
        }

        function startTransmitting() {
            if (pttBtn.disabled) return;
            setMicMute(false);
            pttBtn.classList.add('active');
            pttIcon.className = "fa-solid fa-podcast text-4xl mb-1 animate-pulse";
            pttLabel.innerText = "Zenden...";
            setLed('red', 'Zenden');
            const listeners = isHost ? Object.keys(hostPeers).length : Object.keys(connections).length;
            log("🔊 Je spreekt nu... (" + listeners + " luisteraars)");
        }

        function stopTransmitting() {
            if (pttBtn.disabled) return;
            setMicMute(true);
            pttBtn.classList.remove('active');
            pttIcon.className = "fa-solid fa-microphone text-4xl mb-1";
            pttLabel.innerText = "Houd in";
            setLed('green', isHost ? 'Host online' : 'Online');
            log("Transmissie beëindigd.");
        }

        function enablePTT(enable) {
            pttBtn.disabled = !enable;
            if (enable) {
                pttBtn.classList.remove('opacity-50');
            } else {
                pttBtn.classList.add('opacity-50');
            }
        }

        function updatePeerCount() {
            const count = isHost ? Object.keys(hostPeers).length : Object.keys(connections).length;
            document.getElementById('disp-peers').innerText = count;
        }

        function setLed(color, statusText) {
            document.getElementById('status-led').className = `w-3.5 h-3.5 rounded-full led-${color}`;
            document.getElementById('header-status').innerText = statusText;
        }

        function log(msg) {
            radioLog.innerText = msg;
        }

        // PTT events
        pttBtn.addEventListener('mousedown', startTransmitting);
        pttBtn.addEventListener('mouseup', stopTransmitting);
        pttBtn.addEventListener('mouseleave', stopTransmitting);
        pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTransmitting(); });
        pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopTransmitting(); });
    </script>
</body>
</html>
